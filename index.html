<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Портфоліо</title>
  <style>
    /* Базові стилі */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      color: #111;
    }

    /* ---------- hero ---------- */
    .hero {
      position: relative; /* Тепер якір — це весь екран браузера */
      padding: 88px 0 96px;
      width: 100%;
    }

    /* Внутрішній контейнер для центрування всього основного контенту */
    .hero-inner {
      max-width: 900px;
      margin: 0 auto;
      text-align: center;
      padding: 0 20px;
    }

    .hero-eyebrow {
      position: absolute;  /* Вибиваємо текст із загального потоку */
      left: 1cm;           /* Ідеально рівно 1 см від лівого краю монітора */
      top: 25px;           /* Відступ зверху */
      font-size: clamp(1.4rem, 3.2vw, 2.2rem);
      font-weight: 600;    /* Жирний і помітний */
      white-space: nowrap;
    }

    .hero-title-row {
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 15px;
      max-width: 900px;
    }

    .hero-title-row h1 {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      line-height: 1.2;
      margin: 0;
    }

    .hero-title-row h1 span {
      display: block;
      color: #666;
    }

    .mini-gif {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 50% !important;
    }

    /* Стилі для іконок/інструментів */
    .tools {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 40px;
      flex-wrap: wrap;
    }

    .tools a {
      display: inline-block;
      position: relative;
    }

    .tools img {
      width: 50px;
      height: 50px;
      object-fit: contain;
    }

    /* Простий приклад підказок (tooltip), якщо вони потрібні */
    .tooltip-wrap::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: -30px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: #fff;
      padding: 4px 8px;
      font-size: 12px;
      border-radius: 4px;
      white-space: nowrap;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease;
    }

    .tooltip-wrap:hover::after {
      opacity: 1;
      visibility: visible;
    }
  </style>
</head>
<body>

<section id="hero" class="hero" style="border-top:none;">
  <p class="hero-eyebrow">SMMдизайн✦    дизайн упаковки і мерчу❀    дизайн бренду❆    3Dmodeling☆    2Dграфіка☯    дизайн поліграфії✟</p>
  
  <div class="hero-inner">
    <div class="hero-title-row">
     <img src="animation.gif" alt="Анімація" class="mini-gif">
     <h1>напишіть мені <span>щоб обговорити проєкт</span> або отримати бриф</h1>
    </div>

    <div class="tools">
      <a href="#link1" class="tooltip-wrap" data-tooltip="поліграфія"><img src="гранат.png" alt="Гранат"></a>
      <a href="#link2" class="tooltip-wrap" data-tooltip="3D-моделі"><img src="кубики.png" alt="Кубики"></a>
      <a href="#link3" class="tooltip-wrap" data-tooltip="брендбуки"><img src="скриня.png" alt="Скриня"></a>
      <a href="#link4" class="tooltip-wrap" data-tooltip="упаковка і мерч"><img src="кінь.png" alt="Кінь"></a>
      <a href="#link5" class="tooltip-wrap" data-tooltip="Оформлення соцмереж"><img src="телефон.png" alt="Телефон"></a>
      <a href="#link6" class="tooltip-wrap" data-tooltip="ілюстрації"><img src="булка.png" alt="Булка"></a>
    </div>
  </div>
</section>

</body>
</html>
