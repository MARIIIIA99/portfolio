<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> пупупупу </title>
<meta name="description" content="Дизайн для соцмереж: оформлення профілю, контент-план, обкладинки Reels, рекламні банери.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #E7E8E2;
    --bg-panel: #DEDFD7;
    --ink: #16181A;
    --muted: #63645C;
    --line: rgba(22,24,26,.16);
    --accent: #FF4B1F;
    --accent-dark: #B23000;
    --accent-2: #234C5E;
    --maxw: 1180px;
    --font-display: "Noto Sans", sans-serif;
    --font-body: "Noto Sans", sans-serif;
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior: auto; }
    *{ animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }

  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 18px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  h1,h2,h3{
    font-family: var(--font-display);
    margin: 0;
    line-height: 1.05;
    letter-spacing: -0.01em;
    font-weight: 600;
  }

  p{ margin: 0; }
  a{ color: inherit; }
  ul{ margin:0; padding:0; list-style:none; }
  button{ font-family: inherit; cursor: pointer; }
  
  header a, header nav a, .nav-links a, header ul a {
    font-weight: 700 !important;
    font-size: 24px !important;
  }
  
  :focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .visually-hidden{
    position:absolute; width:1px; height:1px; overflow:hidden;
    clip:rect(0 0 0 0); white-space:nowrap;
  }

  .skip-link{
    position:absolute; top:-40px; left:8px; z-index:200;
    background: var(--ink); color: var(--bg);
    padding: 8px 14px; font-family: var(--font-body); font-size: .9rem;
  }
  .skip-link:focus{ top: 46px; }

  .wrap{
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ---------- header ---------- */
  header{
    position: sticky; top: 0; z-index: 100;
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
  }
  .nav{
    display: flex; align-items: center; justify-content: space-between;
    height: auto;
    padding: 16px 0;
  }
  .logo{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.05rem;
    text-decoration: none;
  }
  .logo-img {
    height: 70px;
    width: auto;
    display: block;
  }
  .nav-links{
    display:flex; gap: 32px;
  }
  .nav-links a{
    text-decoration:none;
    font-size: .95rem;
    padding: 4px 0;
    border-bottom: 1px solid transparent;
    transition: border-color .15s ease, color .15s ease;
  }
  .nav-links a:hover{ border-color: var(--accent); }

  .nav-toggle{
    display:none;
    background:none; border: 1px solid var(--line); padding: 8px 10px;
  }
  .nav-toggle span, .nav-toggle::before, .nav-toggle::after{
    content:""; display:block; width: 20px; height: 2px; background: var(--ink);
    margin: 4px 0;
  }

  @media (max-width: 760px){
    .nav-toggle{ display:block; }
    .nav-links{
      position:absolute; top: 68px; left:0; right:0;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      flex-direction: column; gap: 0;
      max-height: 0; overflow:hidden;
      transition: max-height .25s ease;
    }
    .nav-links.is-open{ max-height: 300px; }
    .nav-links a{ padding: 16px 24px; border-bottom: 1px solid var(--line); }
  }

  /* ---------- hero ---------- */
  .hero {
    position: relative; /* Робимо якір на весь екран */
    padding: 88px 0 96px;
    width: 100%;
  }

  .hero-eyebrow {
    position: absolute;  /* Вибиваємо текст із загального потоку */
    left: 1cm;           /* Строго на 1 см від лівого краю монітора */
    top: 25px;           /* Відступ зверху */
    font-size: clamp(1.2rem, 2.5vw, 1.8rem);
    font-weight: 600;    /* Робимо жирним і гарним */
    white-space: nowrap;
  }

  .hero-inner {
    max-width: 900px;
    margin: 0 auto;
    text-align: center;
  }

  .hero-title-row {
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 15px;
    max-width: 900px;
  }

  .mini-gif {
    width: 100px;
    height: 100px;
    object-fit: cover;
    border-radius: 50%;
    display: block;
    margin: 0 auto;
  }

  .hero h1 {
    font-size: 1.4rem !important;
  }
  .hero h1 span{ color: var(--accent); }

    margin-top: 22px;
    max-width: 48ch;
